<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantsWatch: Rob's Trouser Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden w-full max-w-2xl">
            <!-- Header -->
            <div class="bg-red-600 py-6 px-8 text-center">
                <h1 class="text-4xl md:text-5xl font-bold text-white uppercase tracking-wider">
                    PantsWatch
                </h1>
                <p class="text-white mt-2 text-lg">Official Trouser Incident Tracker</p>
            </div>

            <!-- Counter Section -->
            <div class="py-12 px-8 text-center">
                <div class="mb-8">
                    <h2 class="text-2xl font-semibold text-gray-700 mb-2">Days Since Rob's</h2>
                    <h3 class="text-4xl font-bold text-red-600 uppercase">Shit His Pants</h3>
                </div>
                
                <div class="text-8xl font-bold text-gray-800 mb-8" id="counter">0</div>
                
                <div class="flex justify-center">
                    <button id="resetBtn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg flex items-center transition">
                        <i data-feather="alert-triangle" class="mr-2"></i> Reset Counter
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <div class="bg-gray-100 py-4 px-8 text-center text-gray-600 text-sm">
                <p>Last incident recorded: <span id="lastDate">Never</span></p>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-gray-500 text-sm">
        <p>© 2023 PantsWatch - Keeping trousers clean since today</p>
    </footer>

    <script>
        // Initialize counter from localStorage
        let startDate = localStorage.getItem('startDate');
        
        function calculateDays() {
            if (!startDate) {
                startDate = new Date().toISOString();
                localStorage.setItem('startDate', startDate);
            }
            
            const start = new Date(startDate);
            const now = new Date();
            const diffTime = Math.abs(now - start);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            document.getElementById('counter').textContent = diffDays;
        }
        
        // Update counter immediately and then every hour
        calculateDays();
        setInterval(calculateDays, 1000 * 60 * 60); // Update every hour
        
        // Reset button
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to reset the counter? This indicates a new incident.')) {
                startDate = new Date().toISOString();
                localStorage.setItem('startDate', startDate);
                localStorage.setItem('lastIncident', new Date().toLocaleDateString());
                document.getElementById('lastDate').textContent = new Date().toLocaleDateString();
                calculateDays();
            }
        });
        
        // Display last incident date
        const lastIncident = localStorage.getItem('lastIncident');
        if (lastIncident) {
            document.getElementById('lastDate').textContent = lastIncident;
        }
        
        feather.replace();
    </script>
</body>
</html>
